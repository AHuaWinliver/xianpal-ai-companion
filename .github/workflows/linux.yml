name: Linux distribution compatibility
on:
  push:
    branches: [linux]
  pull_request:
    branches: [linux]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assets:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Generate the approved character artwork
        shell: pwsh
        run: |
          ./build.ps1 -SkipInstaller
          New-Item -ItemType Directory -Path build/linux-resources | Out-Null
          Copy-Item build/payload/assets,build/payload/scenes,build/previews/performances -Destination build/linux-resources -Recurse
          python src/DesktopTasks/XianPal.Linux/fetch-fonts.py build/linux-resources/fonts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-character-resources
          path: build/linux-resources
          retention-days: 7
  modern:
    needs: assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.403
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-character-resources
          path: build/linux-resources
      - name: Build the native application
        run: dotnet publish src/DesktopTasks/XianPal.Linux -r linux-${{ matrix.arch }} --self-contained true -c Release -o build/linux-app
      - name: Validate the shared services on the native architecture
        run: |
          expected=x86_64
          if [ "${{ matrix.arch }}" = arm64 ]; then expected=aarch64; fi
          test "$(uname -m)" = "$expected"
          build/linux-app/xianpal --self-test
      - name: Validate native windows with an isolated CLI fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox libice6 libsm6 libfontconfig1 libx11-6 libxext6 libxrender1 libgl1 libegl1 fonts-noto-cjk fonts-noto-color-emoji
          cp -r build/linux-resources/* build/linux-app/
          xvfb-run -a sh -c 'openbox >/tmp/xianpal-window-manager.log 2>&1 & exec build/linux-app/xianpal --desktop-test build/linux-evidence'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: linux-${{ matrix.runner }}-desktop-evidence
          path: build/linux-evidence
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-${{ matrix.runner }}-build-for-testing
          path: build/linux-app
          retention-days: 7
  centos7-x64:
    needs: assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.403
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-character-resources
          path: build/linux-resources
      - name: Build the CentOS 7 compatibility candidate
        run: |
          dotnet publish src/DesktopTasks/XianPal.Linux -p:LinuxCompat=true -r linux-x64 --self-contained true -c Release -o build/centos7-app
          cp -r build/linux-resources/* build/centos7-app/
          python3 src/DesktopTasks/XianPal.Linux/bundle-runtime.py build/centos7-app
          mkdir -p build/centos7-evidence
      - name: Create a pinned CentOS 7 userspace
        run: docker build -f .github/centos7.Dockerfile -t xianpal-centos7-validation .
      - name: Validate the runtime and native X11 windows against glibc 2.17
        run: |
          status=0
          docker run --rm -v "$PWD/build/centos7-app:/app:ro" -v "$PWD/build/centos7-evidence:/evidence" xianpal-centos7-validation sh -ec '
            getconf GNU_LIBC_VERSION
            /app/launch.sh --self-test
            Xvfb :99 -screen 0 1440x900x24 >/evidence/xvfb.log 2>&1 &
            export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1
            sleep 1
            dbus-run-session -- sh -ec "metacity --replace >/evidence/wm.log 2>&1 & exec /app/launch.sh --desktop-test /evidence"
          ' || status=$?
          sudo chown -R "$(id -u):$(id -g)" "$PWD/build/centos7-evidence"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: centos7-x64-validation-evidence
          path: build/centos7-evidence
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-compat-x64-build-for-testing
          path: build/centos7-app
          retention-days: 7
  distributions:
    needs: [centos7-x64, modern]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-11-x64
            image: debian@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9
            family: debian
          - name: debian-12-x64
            image: debian@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8
            family: debian
          - name: debian-13-x64
            image: debian@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
            family: debian
          - name: ubuntu-20.04-x64
            image: ubuntu@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
            family: debian
          - name: rocky-8-x64
            image: rockylinux@sha256:9794037624aaa6212aeada1d28861ef5e0a935adaf93e4ef79837119f2a2d04c
            family: rhel
          - name: rocky-9-x64
            image: rockylinux@sha256:d7be1c094cc5845ee815d4632fe377514ee6ebcf8efaed6892889657e5ddaaa6
            family: rhel
          - name: alma-8-x64
            image: almalinux@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b
            family: rhel
          - name: alma-9-x64
            image: almalinux@sha256:245f8aab832fe800aa42bdab5fad75ebbd8e0b4c9f24820a83c638b177857ae2
            family: rhel
          - name: opensuse-16-x64
            image: opensuse/leap@sha256:a4115e2f5aea9712a7c73974fd94000a034fc3051ef29b5f7722fbf04070dd9d
            family: suse
          - name: debian-12-arm64
            image: debian@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8
            family: debian
            runner: ubuntu-24.04-arm
            artifact: linux-ubuntu-24.04-arm-build-for-testing
          - name: debian-13-arm64
            image: debian@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
            family: debian
            runner: ubuntu-24.04-arm
            artifact: linux-ubuntu-24.04-arm-build-for-testing
    runs-on: ${{ matrix.runner || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ matrix.artifact || 'linux-compat-x64-build-for-testing' }}
          path: build/distro-app
      - name: Restore executable permissions
        run: |
          chmod +x build/distro-app/xianpal
          if [ -f build/distro-app/launch.sh ]; then chmod +x build/distro-app/launch.sh; fi
          mkdir -p build/distro-evidence
      - name: Prepare pinned distribution userspace
        run: docker build -f .github/linux-distro.Dockerfile --build-arg XIANPAL_IMAGE='${{ matrix.image }}' --build-arg XIANPAL_FAMILY='${{ matrix.family }}' -t xianpal-distribution-validation .
      - name: Check services, fonts and native X11 windows
        run: |
          status=0
          docker run --rm -v "$PWD/build/distro-app:/app:ro" -v "$PWD/build/distro-evidence:/evidence" xianpal-distribution-validation sh -ec '
            cat /etc/os-release > /evidence/environment.txt
            getconf GNU_LIBC_VERSION >> /evidence/environment.txt
            uname -m >> /evidence/environment.txt
            launcher=/app/xianpal
            if [ -x /app/launch.sh ]; then launcher=/app/launch.sh; fi
            "$launcher" --self-test
            Xvfb :99 -screen 0 1440x900x24 >/evidence/xvfb.log 2>&1 &
            export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1
            sleep 1
            dbus-run-session -- sh -ec "openbox >/evidence/wm.log 2>&1 & exec $launcher --desktop-test /evidence"
          ' || status=$?
          sudo chown -R "$(id -u):$(id -g)" "$PWD/build/distro-evidence"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ${{ matrix.name }}-validation-evidence
          path: build/distro-evidence
          if-no-files-found: ignore
