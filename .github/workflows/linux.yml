name: Linux ARM64 port validation
on:
  push:
    branches: [linux]
  pull_request:
    branches: [linux]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assets:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Generate the approved character artwork
        shell: pwsh
        run: |
          ./build.ps1 -SkipInstaller
          New-Item -ItemType Directory -Path build/linux-resources | Out-Null
          Copy-Item build/payload/assets,build/payload/scenes,build/previews/performances -Destination build/linux-resources -Recurse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-character-resources
          path: build/linux-resources
          retention-days: 7
  arm64:
    needs: assets
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.403
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-character-resources
          path: build/linux-resources
      - name: Build the native ARM64 application
        run: dotnet publish src/DesktopTasks/XianPal.Linux -r linux-arm64 --self-contained true -c Release -o build/linux-app
      - name: Validate the shared services on ARM64
        run: |
          test "$(uname -m)" = aarch64
          build/linux-app/xianpal --self-test
      - name: Validate native windows with an isolated CLI fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox libice6 libsm6 libfontconfig1 libx11-6 libxext6 libxrender1 libgl1 libegl1 fonts-noto-cjk fonts-noto-color-emoji
          cp -r build/linux-resources/* build/linux-app/
          xvfb-run -a sh -c 'openbox >/tmp/xianpal-window-manager.log 2>&1 & exec build/linux-app/xianpal --desktop-test build/linux-evidence'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: linux-arm64-desktop-evidence
          path: build/linux-evidence
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-arm64-build-for-testing
          path: build/linux-app
          retention-days: 7
